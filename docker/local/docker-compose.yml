version: '3.8'

services:
  frontend:
    build:
      context: ../../
      dockerfile: docker/local/frontend.Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - backend

  backend:
    build:
      context: ../../
      dockerfile: docker/local/backend.Dockerfile
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=your-jwt-secret
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=cute_todo
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cute_todo
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: 