version: '3.8'

services:
  app:
    build:
      context: ../../backend
      dockerfile: ../docker/local/backend.Dockerfile
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - DB_SSL_MODE=${DB_SSL_MODE}
      - APP_ENV=${APP_ENV}
      - GIN_MODE=debug
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../../backend:/app
    networks:
      - todo-network
    command: air -c .air.toml

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../docker/local/frontend.Dockerfile
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ../../frontend:/app:delegated
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:${BACKEND_PORT}
    depends_on:
      - app
    networks:
      - todo-network

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - todo-network

volumes:
  postgres_data:
  frontend_node_modules:

networks:
  todo-network:
    driver: bridge 