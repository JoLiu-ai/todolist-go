version: '3.8'

services:
  app:
    build:
      context: ../../backend
      dockerfile: ../docker/prod/backend.Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=5432
      - APP_ENV=production
    depends_on:
      - postgres
    networks:
      - todo-network
    restart: always

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - todo-network
    restart: always

volumes:
  postgres_data:

networks:
  todo-network:
    driver: bridge 